# Builds the Sphinx documentation when the package or the docs change, and keeps the HTML as the
# run artifact "docs-html". Publishing to GitHub Pages is opt-in: select "GitHub Actions" as the
# Pages source (Settings > Pages) and set the repository variable DOCS_DEPLOY to "true"; pushes to
# main, or a manual run, then publish. A Pages site is public, even for a private repository.
name: docs

on:
  push:
    branches: [main]
    paths: ["rema/**", "docs/**", "pyproject.toml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["rema/**", "docs/**", "pyproject.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install rema with the docs extra
        run: pip install ".[docs]"
      - name: Build the HTML (warnings are errors)
        run: make -C docs html SPHINXOPTS="-W --keep-going"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
      - if: vars.DOCS_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: >-
      vars.DOCS_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
