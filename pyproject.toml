[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rema-jax"
dynamic = ["version"]
description = "Red-sequence matched-filter galaxy cluster finding in JAX (redMaPPer-inspired), for the Legacy Surveys"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Johan Comparat", email = "jcomparat@lpsc.in2p3.fr"},
]
keywords = ["astronomy", "galaxy clusters", "redMaPPer", "red sequence", "Legacy Surveys", "JAX"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "healpy",
    "pyyaml",
    "jax>=0.9",
    "optax>=0.2.5",
    # Distances and volumes (Mpc/h), pure JAX.  Imported only in rema/model/cosmo.py.
    "ggah_mod>=1.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.9"]
cuda13 = ["jax[cuda13]>=0.9"]
plots = ["matplotlib"]
dev = ["pytest", "pytest-cov", "coverage>=7.10", "matplotlib"]
docs = ["sphinx>=7", "sphinx-rtd-theme", "myst-nb>=1.0"]

[project.scripts]
rema = "rema.cli:main"

[project.urls]
Documentation = "https://rema-jax.readthedocs.io/en/latest/"
Source = "https://github.com/JohanComparat/rema-jax"
Issues = "https://github.com/JohanComparat/rema-jax/issues"
Changelog = "https://github.com/JohanComparat/rema-jax/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "rema.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["rema*"]

[tool.setuptools.package-data]
"rema.data" = ["*.fits", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "rema"]
addopts = "-v --doctest-modules"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "data: needs the local DR11 sweeps, randoms or redMaPPer reference files; skipped when absent",
    "gpu: needs a CUDA device (run with JAX_PLATFORMS=cuda)",
    "network: downloads public inputs (about 16 MB, cached); skipped when offline",
]

[tool.coverage.run]
source = ["rema"]
branch = true
# The SLURM tests run the rema command in subprocesses.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
