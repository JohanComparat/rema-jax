# DR11 south photo-z widths: ZPHOT_STD (Z_PHOT_STD_I) times err_scale, piecewise linear in the z-band
# magnitude through err_scale_mag. Fitted on the 40,850 spectroscopic galaxies of the strip
# (RA 0-5, Dec -15..0) with scripts/photoz/fit_errscale.py: the NMAD of (ZPHOT - ZSPEC)/ZPHOT_STD.
# Use with `rema blind|scan|pscd --set @scripts/photoz/photoz_dr11.yaml`.
photoz:
  err_scale: [0.85, 0.762, 0.679, 0.546, 0.586]
  err_scale_mag: [18.23, 19.35, 20.56, 21.39, 22.4]
  err_floor: 0.01
